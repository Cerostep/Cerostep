name: Update latest articles

on:
  push:
    branches:
      - master
    paths:
      - "_posts/**"
      - "scripts/update_latest_articles.py"
      - ".github/workflows/update-latest-articles.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Update latest article links
        run: python scripts/update_latest_articles.py
      - name: Commit README if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update latest article links"
          git push
