<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <style>
    .language-switch { display: inline-flex; align-items: center; gap: .5rem; margin-left: 1rem; }
    .language-current { font-size: .85em; opacity: .75; }
    .language-toggle { border: 1px solid #828282; border-radius: 999px; padding: 4px 10px; color: inherit; text-decoration: none; }
    .language-toggle:hover { background-color: #eee; text-decoration: none; }
  </style>
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
  <script defer src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", function () {
      if (!window.mermaid) return;

      document.querySelectorAll("pre > code.language-mermaid").forEach(function (code) {
        var container = code.parentElement;
        container.className = "mermaid";
        container.textContent = code.textContent;
      });

      window.mermaid.initialize({ startOnLoad: false, securityLevel: "strict" });
      window.mermaid.run({ querySelector: ".mermaid" });
    });
  </script>
</head>
